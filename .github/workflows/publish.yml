name: publish
run-name: "${{ format('{0} {1}', inputs.pre_release && 'pre-release' || 'release', inputs.bump) }}"

on:
  # push:
  #   branches:
  #     - ci
  #     - dev
  #     - beta
  #     - snapshot-*
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Override version (optional)"
        required: false
        type: string
      # kilocode_change start
      pre_release:
        description: "Publish as pre-release (VS Code marketplace + npm rc channel)"
        required: false
        type: boolean
        default: true
      # kilocode_change end

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

permissions:
  id-token: write
  contents: write
  issues: write
  packages: write
  pull-requests: write

jobs:
  version:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.repository == 'Kilo-Org/kilocode'
    steps:
      - uses: actions/checkout@v6 # kilocode_change
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      # kilocode_change start - install deps for version script workspace resolution
      - name: Install dependencies
        run: bun install
      # kilocode_change end

      - id: version
        run: |
          ./script/version.ts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KILO_BUMP: ${{ inputs.bump }}
          KILO_VERSION: ${{ inputs.version }}
          KILO_PRE_RELEASE: ${{ inputs.pre_release }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          KILO_ORG_ID: ${{ secrets.KILO_ORG_ID }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}

  build-cli:
    needs: version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.repository == 'Kilo-Org/kilocode'
    steps:
      - uses: actions/checkout@v6 # kilocode_change
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      # kilocode_change start
      - name: Setup Zig for Linux sandbox helpers
        run: |
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
            --output "$RUNNER_TEMP/zig.tar.xz"
          echo "473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"
      # kilocode_change end
      - name: Build
        id: build
        run: |
          ./packages/opencode/script/build.ts
        env:
          KILO_VERSION: ${{ needs.version.outputs.version }}
          KILO_RELEASE: ${{ needs.version.outputs.release }}
          KILO_PRE_RELEASE: ${{ inputs.pre_release }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      # kilocode_change start - pack dist tree into a single zstd-compressed tar before upload.
      # download-artifact@v4's streaming unzip is CPU-bound and processes entries one by one;
      # collapsing ~480 files into one tar cuts build-vscode download from >30m to seconds.
      # zstd compresses the wasms (~4x) and leaves the already-compact binaries alone, for
      # ~1 GB artifact. upload-artifact@v7's `archive: false` skips the zip wrapper entirely
      # so the tarball travels as-is (download-artifact@v8 auto-detects via Content-Type).
      # With `archive: false` the `name:` input is ignored; the artifact is named after the
      # file (kilo-cli.tar.zst). zstd + GNU tar are preinstalled on both github-hosted and
      # blacksmith ubuntu-2404. See actions/upload-artifact#36, actions/toolkit#1533.
      - name: Pack CLI dist into tar.zst
        run: |
          find packages/opencode/dist -name '*.map' -delete
          tar --zstd -cf /tmp/kilo-cli.tar.zst -C packages/opencode/dist .

      - uses: actions/upload-artifact@v7
        with:
          path: /tmp/kilo-cli.tar.zst
          archive: false
      # kilocode_change end

    outputs:
      version: ${{ needs.version.outputs.version }}

  # VSCode-only cut: validate serve-only binary from build-cli artifact.
  # Previously validated full `bin/kilo` + bwrap + models list; now validates
  # `bin/kilo-serve` --version / serve --help plus bundled resources (tree-sitter
  # wasms, sandbox worker/network, bwrap, licenses). Build-cli remains
  # serve-only artifact supplier to VSIX; this is bounded smoke of the downloaded
  # artifact, not equivalent to external kilo-bench agent harness smoke.
  validate-cli-unix:
    name: Validate CLI (${{ matrix.target }})
    needs: build-cli
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            uname: arm64
            package: "@kilocode/cli-darwin-arm64"
            mode: host
          - target: darwin-x64
            runner: macos-15-intel
            uname: x86_64
            package: "@kilocode/cli-darwin-x64"
            mode: host
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
            package: "@kilocode/cli-linux-arm64"
            mode: host
          - target: linux-x64
            runner: ubuntu-24.04
            uname: x86_64
            package: "@kilocode/cli-linux-x64"
            mode: host
          - target: alpine-arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
            package: "@kilocode/cli-linux-arm64-musl"
            mode: alpine
            platform: linux/arm64
          - target: alpine-x64
            runner: ubuntu-24.04
            uname: x86_64
            package: "@kilocode/cli-linux-x64-musl"
            mode: alpine
            platform: linux/amd64
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kilo-cli.tar.zst
          path: /tmp
          skip-decompress: true

      - name: Unpack CLI dist
        run: |
          mkdir -p dist
          tar --zstd -xf /tmp/kilo-cli.tar.zst -C dist

      - name: Run CLI smoke test
        run: |
          test "$(uname -m)" = "${{ matrix.uname }}"

          smoke_host() {
            binary="$1"
            echo "Checking $binary --version"
            "$binary" --version
            echo "Checking $binary serve --help"
            "$binary" serve --help
            base="$(dirname "$binary")"
            echo "Validating bundled resources in $base"
            test -f "$base/tree-sitter/tree-sitter.wasm"
            test -f "$base/kilo-sandbox-mutation-worker.js"
            # At least one language wasm should be present
            ls "$base"/tree-sitter/*.wasm | head -n 1
            if [[ "${{ matrix.target }}" == linux-* ]]; then
              test -x "$base/bwrap"
              grep -q '^SPDX-License-Identifier: LGPL-2.0-or-later$' "$base/licenses/bubblewrap/NOTICE"
              "$base/bwrap" --version
              test -f "$base/kilo-sandbox-network-relay" || test -f "$base/kilo-sandbox-network-relay.exe" || echo "relay optional for non-linux"
              # The live user-namespace bootstrap depends on the runner's kernel/AppArmor policy
              # (GitHub-hosted Ubuntu 24.04 sets kernel.apparmor_restrict_unprivileged_userns=1), not on
              # the shipped artifact. The runtime probe degrades gracefully, so keep this check non-fatal.
              "$base/bwrap" --unshare-user --disable-userns --unshare-pid --die-with-parent --new-session \
                --ro-bind / / --dev /dev --proc /proc -- "$base/bwrap" --version \
                || echo "unprivileged user namespaces unavailable on this runner; skipping live sandbox check"
            fi
            # Verify version output is non-empty and mentions serve
            "$binary" --version | grep -Eq '[0-9]+\.[0-9]+\.[0-9]+'
          }

          if [ "${{ matrix.mode }}" = "host" ]; then
            smoke_host "./dist/${{ matrix.package }}/bin/kilo-serve"
            exit 0
          fi

          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$PWD/dist:/dist:ro" \
            -e PACKAGE="${{ matrix.package }}" \
            alpine:3.22 \
            sh -c '
              set -eu
              apk add --no-cache libstdc++ libgcc
              binary="/dist/$PACKAGE/bin/kilo-serve"
              echo "Checking $binary --version"
              "$binary" --version
              echo "Checking $binary serve --help"
              "$binary" serve --help
              base="$(dirname "$binary")"
              test -f "$base/tree-sitter/tree-sitter.wasm"
              test -f "$base/kilo-sandbox-mutation-worker.js"
              test -x "$base/bwrap"
              grep -q '\''^SPDX-License-Identifier: LGPL-2.0-or-later$'\'' "$base/licenses/bubblewrap/NOTICE"
              "$binary" --version | grep -Eq "[0-9]+\.[0-9]+\.[0-9]+"
              "$base/bwrap" --version
            '

  validate-cli-windows:
    name: Validate CLI (windows-${{ matrix.arch }})
    needs: build-cli
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20 # kilocode_change
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
            package: "@kilocode/cli-windows-arm64"
          - arch: x64
            runner: windows-2025
            package: "@kilocode/cli-windows-x64"
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kilo-cli.tar.zst
          path: ${{ runner.temp }}
          skip-decompress: true

      - name: Install zstd
        shell: pwsh
        run: |
          if (-not (Get-Command zstd -ErrorAction SilentlyContinue)) {
            choco install zstandard -y --no-progress
          }

      - name: Unpack CLI dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          zstd -d --stdout "$env:RUNNER_TEMP\kilo-cli.tar.zst" | tar -xf - -C dist

      - name: Run CLI smoke test
        shell: pwsh
        run: |
          $package = "${{ matrix.package }}".Replace("/", "\")
          $binary = ".\dist\$package\bin\kilo-serve.exe"
          Write-Host "Checking $binary --version"
          & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Checking $binary serve --help"
          & $binary serve --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $base = Split-Path $binary -Parent
          if (-not (Test-Path "$base\tree-sitter\tree-sitter.wasm")) { throw "missing tree-sitter.wasm in $base" }
          if (-not (Test-Path "$base\kilo-sandbox-mutation-worker.js")) { throw "missing kilo-sandbox-mutation-worker.js in $base" }
          $versionOut = & $binary --version
          if (-not ($versionOut -match "[0-9]+\.[0-9]+\.[0-9]+")) { throw "version output missing semver: $versionOut" }
          Write-Host "Windows serve-only smoke passed for $binary"

  build-vscode:
    needs:
      - build-cli
      - validate-cli-unix
      - validate-cli-windows
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.repository == 'Kilo-Org/kilocode'
    steps:
      - uses: actions/checkout@v6 # kilocode_change

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v6 # kilocode_change
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install @vscode/vsce
        run: bun install -g @vscode/vsce

      # kilocode_change start - download into /tmp and extract the tar.zst packed by build-cli
      - uses: actions/download-artifact@v8
        with:
          name: kilo-cli.tar.zst
          path: /tmp
          skip-decompress: true

      - name: Unpack CLI dist
        run: |
          mkdir -p packages/opencode/dist
          tar --zstd -xf /tmp/kilo-cli.tar.zst -C packages/opencode/dist
      # kilocode_change end
      - name: Build VSIX packages
        run: bun script/build.ts
        working-directory: ./packages/kilo-vscode
        env:
          CLI_DIST_DIR: ../../packages/opencode/dist
          KILO_VERSION: ${{ needs.build-cli.outputs.version }}
          KILO_PRE_RELEASE: ${{ inputs.pre_release }}
          GH_REPO: ${{ github.repository }}

      - uses: actions/upload-artifact@v7 # kilocode_change
        with:
          name: kilo-vscode
          path: packages/kilo-vscode/out

  # VSCode-only cut: external kilo-bench smoke disabled. That job consumed the public
  # kilo archive (kilo-linux-x64.tar.gz from GH release) which no longer exists once
  # CLI public archive upload is removed. validate-cli-unix/windows above provide a
  # meaningful bounded smoke of the downloaded build-cli artifact (kilo-serve
  # --version / serve --help + bwrap/resources). Not equivalent to agent harness
  # smoke - no Harbor eval, no model invocation - but validates the shipped
  # serve-only binary that gets bundled into the VSIX. The smoke-test.yml workflow
  # file has been removed (not retained), and the workflow allowlist in
  # script/check-workflows.ts stays in sync with no entry for it; restore the
  # file plus the allowlist entry if a manual trigger is needed again.
  # Removed job:
  #   smoke-test:
  #     uses: ./.github/workflows/smoke-test.yml
  #     with: { cli_version: ... }

  publish:
    needs:
      - version
      - build-cli
      - build-vscode
      - validate-cli-unix
      - validate-cli-windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6 # kilocode_change
        # kilocode_change start
        with:
          persist-credentials: false
        # kilocode_change end

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v6 # kilocode_change
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # kilocode_change

      - name: Install @vscode/vsce
        run: bun install -g @vscode/vsce

      - name: Setup Git Committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          # kilocode_change start
          kilo-maintainer-app-id: ${{ secrets.KILO_MAINTAINER_APP_ID }}
          kilo-maintainer-app-secret: ${{ secrets.KILO_MAINTAINER_APP_SECRET }}
          # kilocode_change end

      # VSCode-only: download internal serve-only artifact for VSIX publishing; no GHCR/Docker/AUR steps.
      - uses: actions/download-artifact@v8
        with:
          name: kilo-cli.tar.zst
          path: /tmp
          skip-decompress: true

      - name: Unpack CLI dist
        run: |
          mkdir -p packages/opencode/dist
          tar --zstd -xf /tmp/kilo-cli.tar.zst -C packages/opencode/dist

      - uses: actions/download-artifact@v8
        with:
          name: kilo-vscode
          path: packages/kilo-vscode/out

      - run: ./script/publish.ts
        env:
          KILO_VERSION: ${{ needs.version.outputs.version }}
          KILO_RELEASE: ${{ needs.version.outputs.release }}
          KILO_PRE_RELEASE: ${{ inputs.pre_release }}
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ steps.committer.outputs.token }}
          NPM_CONFIG_PROVENANCE: true
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
          OPENVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
