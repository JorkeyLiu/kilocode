name: Check repository guards

on:
  pull_request:
    paths:
      - ".github/**"
      - "github/**"
      - "packages/extensions/**"
      - "packages/opencode/**"
      - "packages/script/**"
      - "packages/shared/**"
      - "packages/storybook/**"
      - "packages/ui/**"
      - "script/**"
  workflow_dispatch:

# Least privilege: the guards only scan the checked-out files.
permissions:
  contents: read

jobs:
  check-guards:
    name: Check repository guards
    runs-on: ubuntu-latest
    steps:
      # Pinned to the repository-approved commit for checkout v6 (same SHA as
      # check-architecture-impact.yml / nix-eval.yml / nix-hashes.yml). Default
      # fetch-depth (1) is enough: these guards scan current files only.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Pinned to the repository-approved commit for setup-bun v2 (same SHA as
      # check-architecture-impact.yml / test-jetbrains.yml).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Check Effect Promise facade allowlist
        run: bun run script/check-opencode-promise-facades.ts

      - name: Check model tool network boundary
        run: bun run script/check-model-tool-network.ts

      - name: Check workflow allowlist
        run: bun run script/check-workflows.ts
