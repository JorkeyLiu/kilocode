name: "Kilo GitHub Action"
description: "Retired: the standalone Kilo CLI and this GitHub Action are no longer supported. Use the Kilo VS Code extension instead."
branding:
  icon: "code"
  color: "gray-dark"

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  share:
    description: "Share the Kilo session (defaults to true for public repos)"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  use_github_token:
    description: "Use GITHUB_TOKEN directly instead of Kilo App token exchange. When true, skips OIDC and uses the GITHUB_TOKEN env var."
    required: false
    default: "false"

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/kilo,/kc'"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

  oidc_base_url:
    description: "Base URL for OIDC token exchange API. Only required when running a custom GitHub App install. Defaults to https://api.kilo.ai"
    required: false

  kilo_api_key:
    description: "Kilo API key for gateway authentication"
    required: false

  kilo_org_id:
    description: "Kilo organization ID"
    required: false

runs:
  using: "composite"
  steps:
    - name: Retired action
      shell: bash
      run: |
        echo "::error::The standalone Kilo CLI and this GitHub Action are retired and no longer supported. Use the Kilo VS Code extension instead: https://github.com/Kilo-Org/kilocode"
        exit 1
